<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6f1e7"/>
      <stop offset="1" stop-color="#e9dfcb"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="1000" fill="url(#sky)"/>
  <!-- shelves -->
  <g fill="#c9b99a" opacity="0.55">
    <rect x="0" y="330" width="1600" height="14" rx="4"/>
    <rect x="0" y="620" width="1600" height="14" rx="4"/>
    <rect x="0" y="880" width="1600" height="14" rx="4"/>
  </g>
  <!-- book spines on the top shelf -->
  <g opacity="0.5">
    <rect x="40"  y="150" width="34" height="180" rx="4" fill="#b4532a"/>
    <rect x="80"  y="170" width="26" height="160" rx="4" fill="#2f6b5e"/>
    <rect x="112" y="140" width="40" height="190" rx="4" fill="#3d4f8a"/>
    <rect x="158" y="180" width="30" height="150" rx="4" fill="#8a6a1f"/>
    <rect x="194" y="160" width="36" height="170" rx="4" fill="#7a3b5c"/>
    <rect x="236" y="130" width="28" height="200" rx="4" fill="#b4532a"/>
    <rect x="270" y="176" width="42" height="154" rx="4" fill="#2f6b5e"/>
    <rect x="1190" y="150" width="34" height="180" rx="4" fill="#8a6a1f"/>
    <rect x="1230" y="130" width="28" height="200" rx="4" fill="#3d4f8a"/>
    <rect x="1264" y="170" width="40" height="160" rx="4" fill="#b4532a"/>
    <rect x="1310" y="144" width="30" height="186" rx="4" fill="#2f6b5e"/>
    <rect x="1346" y="180" width="36" height="150" rx="4" fill="#7a3b5c"/>
    <rect x="1388" y="160" width="28" height="170" rx="4" fill="#8a6a1f"/>
  </g>
  <!-- books on the middle shelf -->
  <g opacity="0.45">
    <rect x="1040" y="450" width="40" height="170" rx="4" fill="#3d4f8a"/>
    <rect x="1086" y="470" width="30" height="150" rx="4" fill="#b4532a"/>
    <rect x="1122" y="440" width="44" height="180" rx="4" fill="#2f6b5e"/>
