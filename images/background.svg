  <g fill="none" stroke="#b4532a" stroke-width="3" opacity="0.18" stroke-linecap="round">
    <path d="M700 700 q 20 -40 40 0 t 40 0 t 40 0 t 40 0 t 40 0 t 40 0"/>
    <path d="M700 740 q 20 -30 40 0 t 40 0 t 40 0 t 40 0 t 40 0 t 40 0"/>
    <path d="M700 780 q 20 -20 40 0 t 40 0 t 40 0 t 40 0 t 40 0 t 40 0"/>
