<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; media-src 'self'; img-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="description" content="Free audiobooks. No cookies, no trackers.">
  <title>Free Audiobooks</title>
  <link rel="stylesheet" href="style.css?v=6">
</head>
<body>
  <header class="site-head">
    <div class="wrap head-row">
      <a class="logo" href="#top">Free Audiobooks</a>
      <nav class="menu" aria-label="Main">
        <a href="#library">Library</a>
      </nav>
    </div>
  </header>

  <main id="top">
    <section class="hero">
      <div class="hero-art" aria-hidden="true">
        <span class="frame f-fish"></span>
        <span class="frame f-river"></span>
      </div>
      <div class="wrap">
        <h1>Free audiobooks</h1>
        <p class="lead">Press play in your browser, or download a book to keep.</p>
        <a class="button" href="#library">Go to the library</a>
      </div>
    </section>

    <section id="library" class="section">
      <div class="wrap">
        <h2>Library</h2>
        <label class="visually-hidden" for="search">Search audiobooks</label>
        <input type="search" id="search" placeholder="Search audiobooks" autocomplete="off">
        <div id="list" class="grid"></div>
      </div>
    </section>

  </main>

  <footer class="foot">
    <div class="wrap">
      <p>Photo: “Aras river at Nurduz” by Yann Forget, <a href="https://commons.wikimedia.org/wiki/File:Aras_river_at_Nurduz_02.jpg">Wikimedia Commons</a>, <a href="https://creativecommons.org/licenses/by-sa/4.0">CC BY-SA 4.0</a>. Resized.</p>
    </div>
  </footer>

  <script src="app.js?v=6"></script>
</body>
</html>
