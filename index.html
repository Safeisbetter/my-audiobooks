<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; media-src 'self'; img-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="description" content="Free audiobooks. No cookies, no trackers.">
  <title>Free Audiobooks</title>
  <link rel="stylesheet" href="style.css?v=41">
</head>
<body>
  <header class="site-head">
    <div class="wrap head-row">
      <a class="logo" href="#top">Free Audiobooks</a>
    </div>
  </header>

  <main id="top">
    <h1 class="visually-hidden">Free audiobooks</h1>

    <div class="split">
      <section id="library" class="section">
        <div class="wrap">
          <h2 class="lib-title">Library</h2>
          <label class="visually-hidden" for="search">Search audiobooks</label>
          <input type="search" id="search" placeholder="Search audiobooks" autocomplete="off">
          <div id="list" class="grid"></div>
        </div>
      </section>

      <aside class="side">
        <div class="hero-art" aria-hidden="true"></div>
        <section id="app" class="section">
          <div class="wrap">
            <figure class="app-card">
              <img src="images/khwana-cut.jpg?v=1" alt="Khwana: how the audiobook app works, from a book or PDF to the reader, with Rust engine, OCR, translation and Persian voice" loading="lazy" width="1600" height="1520">
            </figure>
          </div>
        </section>
      </aside>
    </div>
  </main>


  <footer class="foot">
    <div class="wrap">
      <p>Contact: <a href="mailto:resistance2026@protonmail.com">resistance2026@protonmail.com</a></p>
      <p>Khana app: <a href="https://github.com/Safeisbetter/khana-reader">github.com/Safeisbetter/khana-reader</a></p>
    </div>
  </footer>

  <script src="app.js?v=41"></script>
</body>
</html>
